
[arena]
	#The arena turns on automatically in worlds whose name contains this text (empty = never; use /hgarena enable).
	autoEnableWorldNameContains = "Hunger Games"
	#Arena radius in blocks around the arena center (the world spawn unless changed with /hgarena setcenter).
	#Range: 8 ~ 5000
	radius = 220
	#Lowest Y a random chest or spawn point may be at.
	#Range: -64 ~ 319
	minY = 70
	#Highest Y a random chest or spawn point may be at (keeps them off walls and roofs).
	#Range: -64 ~ 319
	maxY = 110
	#No new ordinary mobs spawn (naturally, from spawners, reinforcements, summons by other mobs) while the overworld already has this many. Special mobs (location mobs of structures and dragon nests, extra mobs near players) are not counted and not limited. /summon and spawn eggs still work. 0 = no limit.
	#Range: 0 ~ 10000
	maxMobs = 80
	#Mobs of these mods (namespaces) never spawn on their own (natural, spawners, structures). /summon and spawn eggs still work.
	blockedSpawnMods = ["monsterexpansion"]
	#Extra mobs that appear near players during a game, as 'mod:entity=weight' (empty = off).
	extraSpawns = ["netherman:believer=30", "netherman:believer_villager=15", "netherman:guardian=12", "netherman:manipulator=8", "netherman:ghastly=8", "netherman:bell_guardian=3"]
	#Every N seconds of a game each living player may get one extra mob nearby.
	#Range: 1 ~ 3600
	extraSpawnIntervalSeconds = 45
	#Chance per player and interval that an extra mob appears.
	#Range: 0.0 ~ 1.0
	extraSpawnChance = 0.5
	#These mobs (entity ids) never spawn on their own, and ones saved in the world are removed. /summon and spawn eggs still work.
	blockedSpawnMobs = ["fightsfrights:pioneer", "fightsfrights:pioneer_head", "fightsfrights:mimic_pioneer"]

[chests]
	#Every N minutes all arena chests get new random loot and a new wave of random chests appears. 0 = only by command.
	#Range: 0 ~ 1440
	refillIntervalMinutes = 10
	#How many extra chests appear at random places in each refill wave (0 = only the grid chests).
	#Range: 0 ~ 500
	randomChestsPerWave = 0
	#Maximum extra random chests at once; the oldest ones disappear first (grid chests are not counted).
	#Range: 0 ~ 2000
	maxRandomChests = 200
	#Also use every 'chests/...' loot table from all installed mods.
	useAllChestLootTables = true
	#Loot tables always available for arena chests.
	lootTables = ["minecraft:chests/simple_dungeon", "minecraft:chests/abandoned_mineshaft", "minecraft:chests/desert_pyramid", "minecraft:chests/jungle_temple", "minecraft:chests/village/village_weaponsmith", "minecraft:chests/village/village_armorer", "minecraft:chests/village/village_toolsmith", "minecraft:chests/shipwreck_supply", "minecraft:chests/pillager_outpost", "minecraft:chests/ruined_portal", "minecraft:chests/stronghold_corridor", "minecraft:chests/igloo_chest"]
	#Loot tables (or prefixes ending with *) that are never used.
	excludedLootTables = ["minecraft:chests/end_city_treasure", "minecraft:chests/ancient_city*", "minecraft:chests/bastion_treasure", "netherman:chests/azazel_barrel", "netherman:chests/azazel_human_barrel"]
	#At game start chests are placed over the whole arena on a grid with this spacing in blocks.
	#Range: 8 ~ 1000
	gridSpacing = 40
	#No grid chests closer than this to the arena center (keeps the spawn area free).
	#Range: 0 ~ 5000
	gridMinDistanceFromCenter = 45
	#Chance that a grid chest uses a rare loot table (treasure, boss, vault and so on).
	#Range: 0.0 ~ 1.0
	rareTableChance = 0.05
	#Loot tables whose id contains one of these words count as rare.
	rareKeywords = ["treasure", "boss", "vault", "end_city", "ancient", "bastion", "legendary", "epic", "relic", "hoard", "mythic", "artifact", "citadel"]
	#Chance that an ordinary arena chest is filled from a weapon/armor loot table and rerolled until it holds gear.
	#Range: 0.0 ~ 1.0
	gearChestChance = 0.5
	#How many times such a chest is rerolled until it holds a weapon or armor piece.
	#Range: 1 ~ 50
	gearChestRolls = 3

	#Iron's Spells & Spellbooks (only when the mod is installed)
	[chests.spells]
		#Chance that an arena chest gets a ready spell scroll or a spell book with spells.
		#Range: 0.0 ~ 1.0
		spellChestChance = 0.3
		#Of those, the chance that it is a spell book (otherwise a scroll).
		#Range: 0.0 ~ 1.0
		spellBookChance = 0.3
		#Fewest spells inscribed in a spell book.
		#Range: 1 ~ 20
		spellBookMinSpells = 2
		#Most spells inscribed in a spell book (never more than its slots).
		#Range: 1 ~ 20
		spellBookMaxSpells = 4
		#Spell books that can appear, as 'mod:item=weight'.
		spellBooks = ["irons_spellbooks:copper_spell_book=5", "irons_spellbooks:iron_spell_book=4", "irons_spellbooks:gold_spell_book=3", "irons_spellbooks:diamond_spell_book=2", "irons_spellbooks:netherite_spell_book=1"]
		#Iron's Spells items whose id contains one of these words are crafting resources and are taken out of arena chests.
		spellResourceKeywords = ["ink", "essence", "rune", "upgrade_orb", "ingot", "mithril", "arcane_debris", "arcane_salvage", "cloth", "knowledge_fragment", "dragonskin", "frozen_bone", "shard", "divine_pearl", "energized_core", "lightning_bottle", "weapon_parts", "weapon_schematics", "hogskin", "icy_fang", "blood_vial", "bloody_vellum", "pheromones", "venom_vial", "timeless_slurry", "spell_slot_upgrade", "ruined_book", "ice_spider_egg", "furled_map", "logbook", "eldritch_manuscript", "decrepit_key", "bone_key"]

[game]
	#How far from the arena edge the lobby platform is built (blocks, to the south).
	#Range: 16 ~ 5000
	lobbyDistanceFromEdge = 80
	#Y level of the lobby platform floor.
	#Range: -60 ~ 310
	lobbyY = 150
	#Countdown after the start button is pressed.
	#Range: 0 ~ 60
	countdownSeconds = 5
	#Players start on a circle of this radius around the center (grows if many players).
	#Range: 3 ~ 1000
	playerRingRadius = 30
	#Start chests are placed on a circle of this radius, evenly between the players.
	#Range: 2 ~ 1000
	chestRingRadius = 20
	#How many extra start chests per player on the ring between players (0 = none).
	#Range: 0 ~ 20
	chestsPerPlayer = 0
	#Seconds between the victory and the return to the lobby.
	#Range: 1 ~ 120
	endSeconds = 10
	#How many chunks are restored per tick after a game (higher = faster, more lag).
	#Range: 1 ~ 256
	restoreChunksPerTick = 8
	#Inscription tables (Iron's Spells) placed near the arena center each game, to put spells from scrolls into spell books (0 = none).
	#Range: 0 ~ 16
	inscriptionTables = 0
	#Distance of the inscription tables from the arena center.
	#Range: 2 ~ 1000
	inscriptionTableRadius = 12
	#Block used as the inscription table.
	inscriptionTableBlock = "irons_spellbooks:inscription_table"

[zone]
	#Starting zone (world border) size in blocks. 0 = arena diameter + 10.
	#Range: 0 ~ 100000
	startSize = 0
	#The zone never gets smaller than this.
	#Range: 1 ~ 100000
	minSize = 20
	#Each shrink multiplies the zone size by this.
	#Range: 0.05 ~ 0.99
	shrinkFactor = 0.6
	#The zone shrinks every N minutes.
	#Range: 1 ~ 1440
	shrinkIntervalMinutes = 7
	#How long one shrink takes.
	#Range: 1 ~ 3600
	shrinkDurationSeconds = 90
	#Damage per second per block outside the zone.
	#Range: 0.0 ~ 100.0
	damagePerBlock = 1.0

[spawnChests]
	#Chests of the map within this distance of the center are locked spawn chests.
	#Range: 0 ~ 1000
	radius = 20
	#Experience levels a player pays to unlock a spawn chest (0 = not locked). Spawn chests are filled once at game start and never refilled; once paid, a chest stays open for everyone until the game ends.
	#Range: 0 ~ 1000
	requiredLevel = 10
	#Chance that a spawn chest uses a weapon/armor loot table.
	#Range: 0.0 ~ 1.0
	combatTableChance = 0.85
	#A spawn chest is rerolled up to this many times until it holds a weapon or armor piece.
	#Range: 1 ~ 50
	gearRolls = 5
	#Loot tables whose id contains one of these words count as weapon/armor tables.
	combatKeywords = ["weapon", "armor", "armour", "armory", "armoury", "smith", "barracks", "arsenal", "knight", "warrior", "soldier", "military", "outpost", "fortress", "nether_bridge", "bastion", "tower", "dungeon", "castle", "citadel", "guard", "battle", "forge", "keep"]

[locations]
	#Structures from mods that may appear as locations. Every game a few of them are picked at random and fitted onto flat ground.
	structures = ["soulsweapons:champions_graves", "block_factorys_bosses:dragon_tower", "valarian_conquest:bandit_camp", "valarian_conquest:bandit_ruins", "valarian_conquest:valarian_outpost", "takesapillage:pillager_camp", "i_wanna_travel:structure_1fontaine", "i_wanna_travel:structure_20ruinetour", "ancient_remnants:oakwood_monument", "ancient_remnants:warrior_monolith", "craft_of_the_wild:stables"]
	#How many structures are placed each game.
	#Range: 0 ~ 50
	structuresPerGame = 5
	#At most this many large structures per game.
	#Range: 0 ~ 50
	maxLargeStructures = 1
	#A structure whose width or length is at least this many blocks counts as large.
	#Range: 8 ~ 500
	largeSize = 35
	#Dragon nests (configured features). One random type per nest.
	dragonRoosts = ["iceandfire:fire_dragon_roost", "iceandfire:ice_dragon_roost", "iceandfire:lightning_dragon_roost"]
	#Minimum dragon nests per game.
	#Range: 0 ~ 10
	dragonRoostsMin = 1
	#Maximum dragon nests per game.
	#Range: 0 ~ 10
	dragonRoostsMax = 2
	#Locations are at least this far from the arena center.
	#Range: 0 ~ 5000
	minDistanceFromCenter = 60
	#Minimum gap in blocks between two locations.
	#Range: 0 ~ 200
	gap = 32
	#Ground under a location may differ in height by at most this many blocks.
	#Range: 0 ~ 100
	maxSlope = 14
	#The ground under a location is levelled; this many blocks around it are blended into the terrain.
	#Range: 0 ~ 32
	levelMargin = 6
	#Dragon nests appear this many minutes after the game starts (0 = right at the start).
	#Range: 0 ~ 1440
	dragonRoostsDelayMinutes = 15

#DreamShift: chests in the dream locations a player slips into during a game
[dreamshift]
	#Fewest chests placed near the player when they arrive in a dream location.
	#Range: 0 ~ 10
	chestsMin = 1
	#Most chests placed near the player when they arrive in a dream location.
	#Range: 0 ~ 10
	chestsMax = 2
	#Chance that a dream chest uses a rare loot table (treasure, boss, vault...); otherwise it gets weapons/armor.
	#Range: 0.0 ~ 1.0
	rareTableChance = 0.35
	#A weapon/armor dream chest is rerolled up to this many times until it holds a weapon or armor piece.
	#Range: 1 ~ 50
	gearRolls = 5

[airdrop]
	#Every N minutes of a game a chest with very good loot drops at a random spot inside the zone; it is shown on the map (0 = off).
	#Range: 0 ~ 120
	intervalMinutes = 5

[reveal]
	#Experience levels a living player pays (map screen button) to see where the other players are (0 = free).
	#Range: 0 ~ 100
	costLevels = 2
	#How long the other players stay visible on the map after paying.
	#Range: 1 ~ 600
	showSeconds = 20

