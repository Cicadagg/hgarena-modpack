
[arena]
	#The arena turns on automatically in worlds whose name contains this text (empty = never; use /hgarena enable).
	autoEnableWorldNameContains = "Hunger Games"
	#Arena radius in blocks around the arena center (the world spawn unless changed with /hgarena setcenter).
	#Range: 8 ~ 5000
	radius = 220
	#Lowest Y a random chest or spawn point may be at.
	#Range: -64 ~ 319
	minY = 70
	#Highest Y a random chest or spawn point may be at (keeps them off walls and roofs).
	#Range: -64 ~ 319
	maxY = 110
	#No new ordinary mobs spawn (naturally, from spawners, reinforcements, summons by other mobs) while the overworld already has this many. Special mobs (location mobs of structures and dragon nests, extra mobs near players) are not counted and not limited. /summon and spawn eggs still work. 0 = no limit.
	#Range: 0 ~ 10000
	maxMobs = 80
	#Mobs of these mods (namespaces) never spawn on their own (natural, spawners, structures). /summon and spawn eggs still work.
	blockedSpawnMods = ["monsterexpansion"]
	#Extra mobs that appear near players during a game, as 'mod:entity=weight' (empty = off).
	extraSpawns = ["netherman:believer=30", "netherman:believer_villager=15", "netherman:guardian=12", "netherman:manipulator=8", "netherman:bell_guardian=3"]
	#Every N seconds of a game each living player may get one extra mob nearby.
	#Range: 1 ~ 3600
	extraSpawnIntervalSeconds = 45
	#Chance per player and interval that an extra mob appears.
	#Range: 0.0 ~ 1.0
	extraSpawnChance = 0.5
	#These mobs (entity ids) never spawn on their own, and ones saved in the world are removed. /summon and spawn eggs still work.
	blockedSpawnMobs = ["fightsfrights:pioneer", "fightsfrights:pioneer_head", "fightsfrights:mimic_pioneer", "block_factorys_bosses:flaming_skeleton_guard_fireball", "cataclysm:coral_golem", "cataclysm:deepling_angler", "cataclysm:deepling_brute", "cataclysm:deepling_priest", "cataclysm:deepling_warlock", "cataclysm:drowned_host", "cataclysm:endermaptera", "cataclysm:hippocamtus", "cataclysm:ignited_berserker", "cataclysm:ignited_revenant", "cataclysm:lionfish", "cataclysm:nameless_sorcerer", "cataclysm:old_netherite_monstrosity", "cataclysm:symbiocto", "cataclysm:the_watcher", "cataclysm:urchinkin", "caverns_and_chasms:cavefish", "caverns_and_chasms:deeper", "caverns_and_chasms:peeper", "caverns_and_chasms:rat", "creeperoverhaul:bamboo_creeper", "creeperoverhaul:beach_creeper", "creeperoverhaul:desert_creeper", "creeperoverhaul:dripstone_creeper", "creeperoverhaul:ocean_creeper", "creeperoverhaul:savannah_creeper", "creeperoverhaul:snowy_creeper", "dnmmod:defiled_priest", "dnmmod:defiled_wizard", "dnmmod:evil_flame_atronach", "dnmmod:evil_storm_atronach", "dnmmod:flame_atronach", "dnmmod:ghost", "dnmmod:goblin_shaman", "dnmmod:goblin_warrior", "dnmmod:greemon", "dnmmod:hidden_tentacle", "dnmmod:small_ice_spider", "dnmmod:storm_atronach", "dnmmod:undead_spirit", "endermanoverhaul:badlands_enderman", "endermanoverhaul:coral_enderman", "endermanoverhaul:crimson_forest_enderman", "endermanoverhaul:desert_enderman", "endermanoverhaul:flower_fields_enderman", "endermanoverhaul:ice_spikes_enderman", "endermanoverhaul:mushroom_fields_enderman", "endermanoverhaul:savanna_enderman", "endermanoverhaul:scarab", "endermanoverhaul:snowy_enderman", "endermanoverhaul:spirit", "endermanoverhaul:windswept_hills_enderman", "fightsfrights:banshaa", "fightsfrights:fire_swarm", "fightsfrights:grimmsquito", "fightsfrights:hivemite", "fightsfrights:mimentis", "fightsfrights:mimic_allman", "fightsfrights:mimic_banshaa", "fightsfrights:mimic_grimmsquito", "fightsfrights:mimic_patuti", "fights